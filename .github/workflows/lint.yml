name: Lint

on:
  push:
    branches:
      - master

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck curl

      - name: Install chezmoi for template checks
        run: |
          mkdir -p "$RUNNER_TEMP/chezmoi-bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/chezmoi-bin"
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"

      - name: Run ShellCheck
        run: scripts/shellcheck.bash

  shellfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run shfmt
        run: scripts/shfmt.bash
